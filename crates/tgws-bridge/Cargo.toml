[package]
name = "tgws-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Local SOCKS5 bridge to a TgWsProxy instance: obfuscated2 client handshake, transport-tag stripping and dial-with-replay, so any MTProto client can use a local proxy process"
license = "MIT"
readme = "README.md"
keywords = ["telegram", "mtproto", "proxy", "socks5", "obfuscated2"]
categories = ["network-programming", "api-bindings"]
repository = "https://github.com/Nekiplay/gorilla-bot-tg"

[dependencies]
tokio = { version = "1", features = [
    "macros",
    "rt",
    "net",
    "io-util",
    "time",
    "sync",
] }
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
sha2 = "0.10"
rand = "0.9"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "signal",
] }