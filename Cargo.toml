[package]
name = "gorilla-bot"
version = "0.2.0"
edition = "2024"

[dependencies]
tgws-bridge = { path = "crates/tgws-bridge" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
grammers-client = { version = "0.12", features = ["proxy"] }
grammers-session = "0.12"
grammers-mtsender = { version = "0.12", features = ["proxy"] }
grammers-mtproto = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
sha2 = "0.10"
rand = "0.9"
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
gpui-kit = "0.10"
time = { version = "0.3", features = ["local-offset"] }
# Иконка: логотип-исходник в PNG, на старте разбираем в RGBA.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
winicon = { path = "crates/winicon" }

# Иконка и блок версии в exe; на не-Windows компилируется в no-op.
[build-dependencies]
# Многоразмерный .ico для exe собирается из assets/logo.png на этапе сборки.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
winicon = { path = "crates/winicon" }

# Поля, которые winres пишет в ресурс версии exe.
[package.metadata.winres]
FileDescription = "gorilla-bot"
OriginalFilename = "gorilla-bot.exe"
ProductName = "Gorilla Bot"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
debug = false
incremental = false
rpath = false

[profile.dev]
debug = "line-tables-only"

[profile.bench]
inherits = "release"

[profile.release-with-debug]
inherits = "release"
debug = true
